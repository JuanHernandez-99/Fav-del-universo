openapi: 3.0.3
info:
  title: FAV · Catálogo y pedidos para otros grupos
  version: 1.1.0
  description: |
    Capacidad que FAV, una tienda de ropa, ofrece a otro grupo.

    El grupo consumidor puede:
    1. **Ver el catálogo** de FAV: productos publicados, sus variantes (talle y color) y el precio vigente.
    2. **Hacer un pedido**: FAV aparta el stock y registra la venta, que queda **pendiente de pago por
       transferencia**. El pedido lo hace el grupo para sí mismo; no se envían datos de clientes finales.
    3. **Enterarse de cómo sigue el pedido** *(nuevo en 1.1.0)*: FAV avisa por **webhook** cuando el pedido
       se paga o vence, y el estado se puede consultar con `GET /v1/pedidos/{pedidoId}`.

    **Cómo sigue un pedido después de crearlo:** el grupo transfiere el total a FAV. Cuando FAV verifica la
    transferencia, el pedido pasa a `PAGADO` y el stock se descuenta definitivamente. Si no se confirma el
    pago antes de `pago.venceEn` (48 horas), el pedido pasa a `VENCIDO` y el stock se libera.

    **Por qué un webhook.** Quien se entera primero de esos cambios es FAV: el pago lo verifica el
    administrador y el vencimiento ocurre sin que nadie lo pida. Con el webhook, FAV le avisa al grupo en el
    momento, sin que el grupo tenga que preguntar cada tanto. La consulta `GET` queda para confirmar el estado
    o recuperarse si se perdió un aviso. El webhook es **opcional**: si el pedido no trae `notificacionUrl`,
    todo funciona como en la 1.0.0.

    **Compatibilidad:** la 1.1.0 solo agrega (un campo opcional, una operación, un callback, estados y
    códigos de error). Un consumidor de la 1.0.0 sigue funcionando sin cambios.

    **Versionado:** un cambio que puede romper a un consumidor se publica en una ruta nueva (`/v2/...`), y la
    `/v1/...` sigue habilitada hasta una fecha de baja anunciada con 1 semana de anticipación
    **[propuesta]**, nunca antes del fin de la evaluación. Desde el anuncio, las respuestas de la `v1` llevan
    los headers `Deprecation` y `Sunset`; pasada la fecha, responden `410 VERSION_RETIRADA`. Detalle en
    `docs/contracts/README.md` §6.

    Convenciones: **[?]** pendiente de definir · **[propuesta]** sugerido por FAV, sin confirmar.
servers:
  - url: http://localhost:8090
    description: Mock local (`mocks/catalogo-pedidos-v1/`).
  - url: https://pendiente.example
    description: Entorno desplegado. [?] URL pública, antes de la presentación grupal.
security:
  - ClaveDeGrupo: []
tags:
  - name: Catálogo
    description: Productos publicados por FAV.
  - name: Pedidos
    description: Compras del grupo consumidor a FAV.

paths:
  /v1/productos:
    parameters:
      - $ref: "#/components/parameters/CorrelationId"
    get:
      tags: [Catálogo]
      operationId: listarProductos
      summary: Ver el catálogo
      description: |
        Devuelve todos los productos **publicados**, con sus variantes y el precio vigente
        (con la promoción aplicada, si hay una).

        No informa stock: si una variante no alcanza, el pedido responde `409 STOCK_INSUFICIENTE`.
        Devuelve el catálogo completo en una sola respuesta (del orden de cientos de productos).
        La lista va dentro de `items` para poder sumar más adelante una paginación opcional sin romper
        el contrato: sin parámetros seguiría devolviendo todo.
      responses:
        "200":
          description: Catálogo publicado.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Catalogo"
              examples:
                catalogo:
                  $ref: "#/components/examples/Catalogo"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "429":
          $ref: "#/components/responses/LimiteExcedido"
        "500":
          $ref: "#/components/responses/ErrorInterno"
        "503":
          $ref: "#/components/responses/NoDisponible"

  /v1/pedidos:
    parameters:
      - $ref: "#/components/parameters/CorrelationId"
    post:
      tags: [Pedidos]
      operationId: crearPedido
      summary: Hacer un pedido
      description: |
        Aparta el stock de todas las variantes pedidas y registra la venta, **pendiente de pago por
        transferencia**. Es **todo o nada**: si una variante no alcanza, no se aparta ninguna.

        - El precio lo calcula FAV al momento del pedido (precio vigente). Se devuelve en la respuesta.
        - El stock queda apartado hasta `pago.venceEn` (48 horas). Si no se confirma la transferencia
          en ese plazo, el pedido vence y el stock se libera.
        - **Idempotencia:** el header `Idempotency-Key` es obligatorio. Repetir el pedido con la misma
          clave y el mismo cuerpo devuelve la misma respuesta, sin crear otro pedido. La misma clave con
          otro cuerpo devuelve `409 CLAVE_IDEMPOTENCIA_REUTILIZADA`.
        - **Avisos (opcional, desde 1.1.0):** si el cuerpo trae `notificacionUrl`, FAV envía ahí el
          webhook `pedidoActualizado` cada vez que el pedido cambia de estado. Ver *Callbacks*.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PedidoNuevo"
            examples:
              pedido:
                $ref: "#/components/examples/PedidoNuevo"
              pedidoConAvisos:
                $ref: "#/components/examples/PedidoNuevoConAvisos"
      responses:
        "201":
          description: Pedido creado, pendiente de pago por transferencia.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pedido"
              examples:
                pedido:
                  $ref: "#/components/examples/Pedido"
        "400":
          description: |
            - `PEDIDO_INVALIDO`: falta un header obligatorio (por ejemplo `Idempotency-Key`) o el cuerpo no cumple el contrato (incluida una `notificacionUrl` inválida). `errores` indica los campos.
            - `VARIANTE_INEXISTENTE`: una variante no existe o su producto no está publicado. `variantes` indica cuáles.

            No reintentar sin corregir el pedido.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
              examples:
                pedidoInvalido:
                  $ref: "#/components/examples/PedidoInvalido"
                varianteInexistente:
                  value:
                    type: https://fav.example/errores/variante-inexistente
                    title: Variante inexistente
                    status: 400
                    detail: La variante var-inexistente no existe o no está publicada.
                    codigo: VARIANTE_INEXISTENTE
                    variantes: [var-inexistente]
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "409":
          description: |
            - `STOCK_INSUFICIENTE`: al menos una variante no alcanza; no se apartó nada. `faltantes` indica cuáles.
            - `CLAVE_IDEMPOTENCIA_REUTILIZADA`: la `Idempotency-Key` ya se usó con otro cuerpo.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
              examples:
                stockInsuficiente:
                  value:
                    type: https://fav.example/errores/stock-insuficiente
                    title: Stock insuficiente
                    status: 409
                    detail: Al menos una variante no alcanza. No se apartó ninguna unidad.
                    codigo: STOCK_INSUFICIENTE
                    faltantes:
                      - varianteId: var-remera-basica-blanca-m
                        solicitada: 3
                claveReutilizada:
                  value:
                    type: https://fav.example/errores/clave-idempotencia-reutilizada
                    title: Clave de idempotencia reutilizada
                    status: 409
                    detail: La Idempotency-Key ya se usó con un pedido distinto.
                    codigo: CLAVE_IDEMPOTENCIA_REUTILIZADA
        "429":
          $ref: "#/components/responses/LimiteExcedido"
        "500":
          $ref: "#/components/responses/ErrorInterno"
        "503":
          $ref: "#/components/responses/NoDisponible"
      callbacks:
        pedidoActualizado:
          "{$request.body#/notificacionUrl}":
            post:
              tags: [Pedidos]
              operationId: pedidoActualizado
              summary: Aviso de cambio de estado (webhook)
              description: |
                **Lo envía FAV** a la `notificacionUrl` del pedido cuando el pedido pasa a `PAGADO`,
                `VENCIDO` o `A_VERIFICAR`. Lo recibe un endpoint del grupo consumidor.

                **Qué tiene que hacer el receptor:**
                1. **Verificar la firma** del header `X-FAV-Firma` antes de confiar en el cuerpo
                   (ver el header). Firma inválida o vencida: responder `401` y descartar.
                2. **Deduplicar por `eventoId`:** el mismo aviso puede llegar más de una vez. Si ya se
                   procesó, responder `200` sin repetir el efecto.
                3. **Responder `2xx` rápido** (en menos de 5 segundos) y hacer el trabajo pesado después.
                4. Si hay dudas (aviso fuera de orden, datos que no cierran), **consultar
                   `GET /v1/pedidos/{pedidoId}`**: el estado vigente es el de esa consulta, no el del aviso.

                **Entrega:** al menos una vez. Si FAV no recibe un `2xx` en 5 segundos, reintenta a los
                1, 5, 15 y 60 minutos. Agotados los intentos, el aviso se
                descarta y el estado sigue disponible con el `GET`.

                **Orden:** los estados solo avanzan (`PENDIENTE_DE_PAGO` → `PAGADO` o `VENCIDO`;
                `VENCIDO` → `A_VERIFICAR`). Si llega un aviso con un estado anterior al que ya se
                tiene, se puede ignorar.
              security: []
              parameters:
                - name: X-FAV-Firma
                  in: header
                  required: true
                  description: |
                    Firma del aviso, con el formato `t=<timestamp>,v1=<firma>`:
                    - `t`: segundos desde 1970 (Unix) en que FAV firmó el aviso.
                    - `v1`: HMAC-SHA256 en hexadecimal de `<t>.<cuerpo>`, donde `<cuerpo>` es el cuerpo
                      **crudo, tal cual se recibió** (sin volver a serializar el JSON), y la clave es el
                      **secreto de avisos** del grupo.

                    El receptor recalcula la firma, la compara en tiempo constante y rechaza el aviso
                    si `t` tiene más de 5 minutos de antigüedad **[propuesta]**.

                    El secreto de avisos lo entrega FAV junto con la clave del grupo **[?]**. En el mock
                    el secreto es `secreto-de-prueba`.

                    **Vector de prueba:** el ejemplo de este header es la firma real del ejemplo `pagado`
                    serializado en una línea, sin espacios (como se envía), con el secreto `secreto-de-prueba`.
                  schema:
                    type: string
                    pattern: '^t=\d+,v1=[0-9a-f]{64}$'
                  example: t=1792243201,v1=2fbec75293b36b2159e73e8c8c1a36062411d20762993a8755dd47a211182ab4
                - name: X-FAV-Evento-Id
                  in: header
                  required: true
                  description: El mismo `eventoId` del cuerpo, para deduplicar sin leer el cuerpo.
                  schema:
                    type: string
                    format: uuid
                  example: 3b7e9a2c-5d1f-4c8e-a9b0-6f2d1e4c7a8b
                - $ref: "#/components/parameters/CorrelationId"
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      $ref: "#/components/schemas/EventoPedido"
                    examples:
                      pagado:
                        $ref: "#/components/examples/EventoPagado"
                      vencido:
                        $ref: "#/components/examples/EventoVencido"
              responses:
                "200":
                  description: Aviso recibido (o ya procesado antes). Cualquier `2xx` vale.
                "401":
                  description: Firma inválida o vencida. FAV no reintenta este aviso.
                "5XX":
                  description: El receptor falló. FAV reintenta según la política de entrega.

  /v1/pedidos/{pedidoId}:
    parameters:
      - $ref: "#/components/parameters/CorrelationId"
      - name: pedidoId
        in: path
        required: true
        description: El `pedidoId` devuelto al crear el pedido.
        schema:
          type: string
          format: uuid
        example: 7d9f2c1e-4b3a-4e8f-9c2d-1a0b3c4d5e6f
    get:
      tags: [Pedidos]
      operationId: consultarPedido
      summary: Consultar un pedido
      description: |
        *(Nuevo en 1.1.0.)* Devuelve el pedido con su **estado vigente**. Sirve para confirmar lo que
        dijo un webhook o para ponerse al día si se perdió un aviso.

        Solo se pueden consultar los pedidos del propio grupo: un pedido de otro grupo responde
        `404 PEDIDO_INEXISTENTE`, igual que uno que no existe.
      responses:
        "200":
          description: El pedido con su estado vigente.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pedido"
              examples:
                pagado:
                  $ref: "#/components/examples/PedidoPagado"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "404":
          description: "`PEDIDO_INEXISTENTE`: el pedido no existe o es de otro grupo. No reintentar."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
              examples:
                pedidoInexistente:
                  value:
                    type: https://fav.example/errores/pedido-inexistente
                    title: Pedido inexistente
                    status: 404
                    codigo: PEDIDO_INEXISTENTE
        "429":
          $ref: "#/components/responses/LimiteExcedido"
        "500":
          $ref: "#/components/responses/ErrorInterno"
        "503":
          $ref: "#/components/responses/NoDisponible"

components:
  securitySchemes:
    ClaveDeGrupo:
      type: apiKey
      in: header
      name: X-API-Key
      description: Clave propia del grupo consumidor, entregada por FAV. **[?]** cómo se entrega y se rota.

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Clave única por pedido lógico (se recomienda un UUID). Ante timeout, `500` o `503`,
        reintentar con la misma clave y el mismo cuerpo. Vigencia: 48 horas **[propuesta]**.
      schema:
        type: string
        minLength: 8
        maxLength: 100
      example: 6f1c2b8e-3d4a-4e5f-9a7b-1c2d3e4f5a6b
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: Identificador para seguir la operación en los logs de ambos sistemas. Si no se envía, FAV genera uno.
      schema:
        type: string
        maxLength: 100

  headers:
    CorrelationId:
      description: El mismo identificador recibido, o uno generado por FAV.
      schema:
        type: string
    RetryAfter:
      description: Segundos a esperar antes de reintentar.
      schema:
        type: integer

  schemas:
    Catalogo:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Producto"

    Producto:
      type: object
      required: [productoId, nombre, categoria, variantes]
      properties:
        productoId:
          type: string
        nombre:
          type: string
        categoria:
          type: string
          description: Una de las categorías de FAV (por ejemplo `remeras`, `jeans`, `buzos`).
        descripcion:
          type: string
          description: Opcional.
        fotoUrl:
          type: string
          format: uri
          description: Foto principal. Opcional; puede no venir.
        variantes:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/Variante"

    Variante:
      type: object
      required: [varianteId, talle, color, precio]
      properties:
        varianteId:
          type: string
          description: Identificador a usar en el pedido.
        talle:
          type: string
        color:
          type: string
        precio:
          type: number
          format: double
          description: Precio vigente por unidad, en pesos argentinos, con la promoción aplicada si hay una.

    PedidoNuevo:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        referenciaExterna:
          type: string
          maxLength: 100
          description: Identificador del pedido en el sistema del grupo. Se guarda y se devuelve.
        notificacionUrl:
          type: string
          format: uri
          maxLength: 500
          pattern: "^https?://"
          description: |
            *(Opcional, desde 1.1.0.)* Endpoint del grupo donde FAV envía el webhook `pedidoActualizado`.
            Tiene que ser alcanzable desde FAV: en el entorno desplegado, una URL pública con `https`
            **[propuesta]**; con el mock local, por ejemplo `http://host.docker.internal:9000/...`.
            Forma parte del pedido: cuenta para la idempotencia como el resto del cuerpo.
        items:
          type: array
          minItems: 1
          maxItems: 20
          description: Hasta 20 variantes por pedido **[propuesta]**. Una variante no puede repetirse.
          items:
            $ref: "#/components/schemas/ItemPedido"

    ItemPedido:
      type: object
      additionalProperties: false
      required: [varianteId, cantidad]
      properties:
        varianteId:
          type: string
        cantidad:
          type: integer
          minimum: 1
          maximum: 10
          description: Hasta 10 unidades por variante **[propuesta]**.

    EstadoPedido:
      type: string
      enum: [PENDIENTE_DE_PAGO, PAGADO, VENCIDO, A_VERIFICAR]
      description: |
        - `PENDIENTE_DE_PAGO`: el stock está apartado hasta `pago.venceEn`, esperando la transferencia.
          Es el estado con el que se crea **siempre** el pedido.
        - `PAGADO`: FAV verificó la transferencia; el stock se descontó. La entrega se coordina por el
          contacto (§7 del README).
        - `VENCIDO`: pasaron las 48 horas sin que FAV verifique el pago; el stock se liberó.
        - `A_VERIFICAR`: la transferencia llegó cuando el pedido ya había vencido. FAV lo revisa a mano
          y se comunica por el contacto **[?]** (reintegro o nueva reserva).

        En una versión menor futura pueden agregarse estados. **Un estado que no se conoce** se trata
        como "en revisión": no se toma ninguna acción automática y se consulta por el contacto.

    Pedido:
      type: object
      required: [pedidoId, estado, items, total, moneda, pago, creadoEn]
      properties:
        pedidoId:
          type: string
          format: uuid
        referenciaExterna:
          type: string
        estado:
          $ref: "#/components/schemas/EstadoPedido"
        items:
          type: array
          items:
            $ref: "#/components/schemas/ItemPedidoConPrecio"
        total:
          type: number
          format: double
        moneda:
          type: string
          enum: [ARS]
        pago:
          $ref: "#/components/schemas/Pago"
        notificacionUrl:
          type: string
          description: "*(Desde 1.1.0.)* La URL de avisos registrada para el pedido, si se envió."
        creadoEn:
          type: string
          format: date-time
        actualizadoEn:
          type: string
          format: date-time
          description: "*(Desde 1.1.0.)* Último cambio de estado."

    ItemPedidoConPrecio:
      type: object
      required: [varianteId, cantidad, precioUnitario, subtotal]
      properties:
        varianteId:
          type: string
        cantidad:
          type: integer
        precioUnitario:
          type: number
          format: double
        subtotal:
          type: number
          format: double

    Pago:
      type: object
      required: [medio, venceEn, datosTransferencia]
      properties:
        medio:
          type: string
          enum: [TRANSFERENCIA]
        venceEn:
          type: string
          format: date-time
          description: Hasta cuándo queda apartado el stock esperando la transferencia (48 horas).
        datosTransferencia:
          type: object
          description: Datos bancarios de FAV para transferir. **[?]** los define el cliente; los del ejemplo son ficticios.
          required: [alias, titular]
          properties:
            alias:
              type: string
            titular:
              type: string

    EventoPedido:
      type: object
      description: |
        Cuerpo del webhook `pedidoActualizado`. Avisa que el pedido cambió de estado; el estado vigente
        siempre se puede confirmar con `GET /v1/pedidos/{pedidoId}`.
        El receptor debe **ignorar los campos que no conozca** (se pueden agregar en versiones menores).
      required: [eventoId, tipo, ocurridoEn, pedido]
      properties:
        eventoId:
          type: string
          format: uuid
          description: Identificador único del aviso. Es el mismo en todos los reintentos, así que sirve para deduplicar.
        tipo:
          type: string
          enum: [pedido.actualizado]
        ocurridoEn:
          type: string
          format: date-time
          description: Cuándo cambió el estado en FAV (no cuándo se envió el aviso).
        pedido:
          type: object
          required: [pedidoId, estado]
          properties:
            pedidoId:
              type: string
              format: uuid
            referenciaExterna:
              type: string
              description: La que envió el grupo al crear el pedido, si la envió.
            estado:
              $ref: "#/components/schemas/EstadoPedido"

    Problema:
      type: object
      description: Error en formato Problem Details (RFC 9457) con un `codigo` estable. Decidir siempre por `codigo`.
      required: [type, title, status, codigo]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        codigo:
          type: string
          enum:
            - PEDIDO_INVALIDO
            - NO_AUTENTICADO
            - STOCK_INSUFICIENTE
            - CLAVE_IDEMPOTENCIA_REUTILIZADA
            - VARIANTE_INEXISTENTE
            - PEDIDO_INEXISTENTE
            - VERSION_RETIRADA
            - LIMITE_EXCEDIDO
            - ERROR_INTERNO
            - NO_DISPONIBLE
        errores:
          type: array
          description: Solo en `PEDIDO_INVALIDO`. Campos con problemas.
          items:
            type: object
            properties:
              campo:
                type: string
              mensaje:
                type: string
        faltantes:
          type: array
          description: Solo en `STOCK_INSUFICIENTE`. Variantes que no alcanzan.
          items:
            type: object
            properties:
              varianteId:
                type: string
              solicitada:
                type: integer
        variantes:
          type: array
          description: Solo en `VARIANTE_INEXISTENTE`. Variantes que no existen o no están publicadas.
          items:
            type: string

  responses:
    NoAutenticado:
      description: Falta la clave del grupo o no es válida.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problema"
          examples:
            noAutenticado:
              value:
                type: https://fav.example/errores/no-autenticado
                title: No autenticado
                status: 401
                codigo: NO_AUTENTICADO
    LimiteExcedido:
      description: Demasiados pedidos del grupo (60 por minuto **[propuesta]**). Reintentar después de `Retry-After`.
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problema"
          examples:
            limiteExcedido:
              value:
                type: https://fav.example/errores/limite-excedido
                title: Límite excedido
                status: 429
                codigo: LIMITE_EXCEDIDO
    ErrorInterno:
      description: Error inesperado de FAV. Reintentar con la misma `Idempotency-Key`.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problema"
          examples:
            errorInterno:
              value:
                type: https://fav.example/errores/error-interno
                title: Error interno
                status: 500
