# Prometheus (ADR-011). Descubre todas las réplicas de Inventario por el DNS de Docker:
# cada réplica es un objetivo distinto, así se ve el reparto de carga del balanceo (ADR-012).
global:
  scrape_interval: 5s

scrape_configs:
  - job_name: inventario
    dns_sd_configs:
      - names: [inventario]
        type: A
        port: 8080
        refresh_interval: 10s
