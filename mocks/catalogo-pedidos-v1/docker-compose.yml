# Mock del contrato catalogo-pedidos-v1. Responde con los ejemplos del contrato.
# Uso: docker compose up   →   http://localhost:8090
services:
  mock-catalogo-pedidos-v1:
    image: stoplight/prism:5
    command: mock -h 0.0.0.0 -p 4010 /contracts/catalogo-pedidos-v1.openapi.yaml
    volumes:
      - ../../docs/contracts:/contracts:ro
    ports:
      - "8090:4010"
