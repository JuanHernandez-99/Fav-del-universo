# Mock del contrato emails-v1 (opción B). Responde con los ejemplos del contrato.
# Uso: docker compose up   →   http://localhost:8091
services:
  mock-emails-v1:
    image: stoplight/prism:5 # versión [propuesta]
    command: mock -h 0.0.0.0 -p 4010 /contracts/emails-v1.openapi.yaml
    volumes:
      - ../../docs/contracts:/contracts:ro
    ports:
      - "8091:4010"
