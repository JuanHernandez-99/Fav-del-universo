# Encabezados hacia los servicios en las rutas que validan el token. proxy_set_header en una location anula
# los heredados: por eso se repiten los comunes. La identidad sale solo del token validado: lo que mande el
# cliente en X-User-* se pisa acá. El token no sigue viaje: los servicios no lo necesitan.
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Correlation-Id $correlacion;
proxy_set_header Authorization "";
proxy_set_header X-User-Id $usuario_id;
proxy_set_header X-User-Email $usuario_email;
proxy_set_header X-User-Role $usuario_rol;

auth_request_set $usuario_id $sent_http_x_user_id;
auth_request_set $usuario_email $sent_http_x_user_email;
auth_request_set $usuario_rol $sent_http_x_user_role;

# Los errores del token tienen el formato de todos los demás.
error_page 401 = @no_autenticado;
error_page 403 = @no_autorizado;
