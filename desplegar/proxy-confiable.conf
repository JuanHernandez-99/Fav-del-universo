# Solo en la nube (docker-compose.cloud.yml lo monta en el gateway).
# Caddy le pasa al gateway la IP del comprador en X-Forwarded-For. nginx la cree solo si el pedido viene
# de la IP fija de Caddy: si le creyera a cualquiera, un atacante cambiaría ese encabezado en cada intento
# y el límite de inicios de sesión por IP no lo frenaría.
set_real_ip_from 172.30.250.10;
real_ip_header X-Forwarded-For;
