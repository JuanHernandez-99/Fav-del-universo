# Arranque local con un solo comando:   docker compose up --build
# Funciona sin .env (usa valores de prueba). Para cambiarlos: cp .env.example .env
#
# Entrega 2: Inventario es el servicio real (dos réplicas detrás del gateway). Catálogo, Ventas
# y el gimnasio están simulados. Lo que todavía no se usa queda en el perfil `completo`:
#   docker compose --profile completo up
#
# Puertos publicados:
#   8080  gateway (capacidad publicada y panel)     16686  Jaeger (trazas)
#   9090  Prometheus (métricas)                      3307   MySQL de Inventario (tests)
#   8095  mock del gimnasio (admin de WireMock)

x-otel: &otel
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318

services:
  # ---------- Inventario (real) ----------
  inventario:
    build: ./services/inventario
    deploy: { replicas: 2 } # ADR-012
    environment:
      <<: *otel
      INVENTARIO_DB_HOST: mysql-inventario:3306
      INVENTARIO_DB_NAME: ${INVENTARIO_DB_NAME:-inventario}
      INVENTARIO_DB_USER: ${INVENTARIO_DB_USER:-inventario}
      INVENTARIO_DB_PASSWORD: ${INVENTARIO_DB_PASSWORD:-cambiar}
      INVENTARIO_DATOS_EJEMPLO: ${INVENTARIO_DATOS_EJEMPLO:-true}
      GIMNASIO_URL: http://gimnasio-mock:8080
      GIMNASIO_API_KEY: ${GIMNASIO_API_KEY:-clave-de-fav-en-el-gimnasio}
    depends_on:
      mysql-inventario: { condition: service_healthy }
    restart: unless-stopped

  mysql-inventario:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${INVENTARIO_DB_ROOT_PASSWORD:-cambiar}
      MYSQL_DATABASE: ${INVENTARIO_DB_NAME:-inventario}
      MYSQL_USER: ${INVENTARIO_DB_USER:-inventario}
      MYSQL_PASSWORD: ${INVENTARIO_DB_PASSWORD:-cambiar}
    ports: ["3307:3306"]
    volumes: [mysql-inventario-data:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ---------- Gateway ----------
  gateway:
    image: nginx:1.28-alpine
    environment:
      CAPACIDAD_API_KEY: ${CAPACIDAD_API_KEY:-clave-grupo-proveedores}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-clave-admin-local}
      NGINX_ENVSUBST_FILTER: "^(CAPACIDAD_API_KEY|ADMIN_API_KEY)$" # no tocar las $variables de nginx
    volumes:
      - ./gateway/templates:/etc/nginx/templates:ro
    ports: ["8080:8080"]
    depends_on: [inventario, catalogo-ventas-mock]

  # ---------- Dependencias simuladas ----------
  # Catálogo y Ventas: atiende la capacidad publicada y aparta el stock en Inventario.
  catalogo-ventas-mock:
    build: ./mocks/catalogo-ventas
    environment:
      <<: *otel
      INVENTARIO_URL: http://gateway:8081 # pasa por el balanceo

  # Gimnasio: capacidad consumida, con el contrato supuesto (ADR-009).
  gimnasio-mock:
    image: wiremock/wiremock:3.9.1
    command: ["--global-response-templating", "--disable-banner"]
    volumes:
      - ./mocks/gimnasio-consignacion/mappings:/home/wiremock/mappings:ro
    ports: ["8095:8080"]

  # ---------- Observabilidad (ADR-011) ----------
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    ports: ["16686:16686"]

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./observabilidad/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]

  # ---------- Previsto (perfil `completo`) ----------
  mongo-catalogo:
    profiles: [completo]
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-catalogo}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-cambiar}
    volumes: [mongo-catalogo-data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  mysql-ventas:
    profiles: [completo]
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${VENTAS_DB_ROOT_PASSWORD:-cambiar}
      MYSQL_DATABASE: ${VENTAS_DB_NAME:-ventas}
      MYSQL_USER: ${VENTAS_DB_USER:-ventas}
      MYSQL_PASSWORD: ${VENTAS_DB_PASSWORD:-cambiar}
    volumes: [mysql-ventas-data:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  mysql-usuarios:
    profiles: [completo]
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${USUARIOS_DB_ROOT_PASSWORD:-cambiar}
      MYSQL_DATABASE: ${USUARIOS_DB_NAME:-usuarios}
      MYSQL_USER: ${USUARIOS_DB_USER:-usuarios}
      MYSQL_PASSWORD: ${USUARIOS_DB_PASSWORD:-cambiar}
    volumes: [mysql-usuarios-data:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    profiles: [completo]
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-fav}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-cambiar}
    ports: ["15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mongo-catalogo-data:
  mysql-inventario-data:
  mysql-ventas-data:
  mysql-usuarios-data:
