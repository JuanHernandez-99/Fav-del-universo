server {
    listen 80;
    root /usr/share/nginx/html;

    # Los archivos de Vite llevan un hash en el nombre: si cambian, cambia el nombre.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Las rutas (/producto/..., /carrito) las resuelve React: siempre se entrega index.html, sin caché.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
